[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    unit: Quick unit tests for utility and formatting modules
    integration: Full end-to-end user journey and route tests
    security: Input sanitization, path traversal, and auth guard tests
    inference: Deep learning model forward pass and PyTorch tests
    a11y: Accessibility, responsive viewport, and ARIA markup tests
